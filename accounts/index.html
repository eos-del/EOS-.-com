<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EOS Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<div class="background"></div>


<div class="login-box">

    <h1>EOS</h1>

    <p>Welcome Back</p>


    <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email"
    >


    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button
        id="loginButton"
        type="button"
    >
        Login
    </button>


    <a
        href="#"
        id="forgotPassword"
    >
        Forgot Password?
    </a>


    <a href="signup.html">
        Create Account
    </a>


    <p id="message"></p>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyBXeNMJe6wMEb2u5KfDwOURenwF8f7Nlvg",

        authDomain:
            "eos-platform-of-gods.firebaseapp.com",

        projectId:
            "eos-platform-of-gods",

        storageBucket:
            "eos-platform-of-gods.firebasestorage.app",

        messagingSenderId:
            "313477636204",

        appId:
            "1:313477636204:web:4c869dd4e207dc01a03849"

    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    const message =
        document.getElementById("message");


    /*
       -----------------------------------------
       LOGOUT CHECK
       -----------------------------------------
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const isLogout =
        params.get("logout") === "1";


    /*
       If dashboard sent us here with
       ?logout=1, sign out FIRST.
    */

    if (isLogout) {

        message.textContent =
            "Logging out of EOS...";


        try {

            await signOut(auth);

            /*
               Remove ?logout=1 from
               the address bar.
            */

            window.history.replaceState(
                {},
                document.title,
                "index.html"
            );


            message.textContent =
                "Logged out successfully.";

        }

        catch (error) {

            console.error(error);

            message.textContent =
                "Logout failed.";

        }

    }


    /*
       -----------------------------------------
       LOGIN
       -----------------------------------------
    */

    document
        .getElementById("loginButton")
        .addEventListener(
            "click",
            async () => {

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!email || !password) {

                    message.textContent =
                        "Enter your email and password.";

                    return;

                }


                message.textContent =
                    "Logging in...";


                try {

                    const credential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        credential.user;


                    if (!user.emailVerified) {

                        message.textContent =
                            "Please verify your email first.";

                        await signOut(auth);

                        return;

                    }


                    message.textContent =
                        "Login successful!";


                    window.location.replace(
                        "dashboard.html"
                    );

                }

                catch (error) {

                    console.error(error);

                    message.textContent =
                        error.message;

                }

            }
        );


    /*
       -----------------------------------------
       FORGOT PASSWORD
       -----------------------------------------
    */

    document
        .getElementById("forgotPassword")
        .addEventListener(
            "click",
            async (event) => {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                if (!email) {

                    message.textContent =
                        "Enter your email first.";

                    return;

                }


                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    message.textContent =
                        "Password reset email sent!";

                }

                catch (error) {

                    console.error(error);

                    message.textContent =
                        error.message;

                }

            }
        );

</script>


</body>

</html>
