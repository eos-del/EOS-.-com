<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EOS Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .dashboard-page {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 50px 0 80px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .dashboard-header h1 {
            margin: 0;
        }

        .dashboard-header p {
            margin-top: 8px;
        }

        .account-card,
        .studio-card {
            padding: 28px;
            margin-bottom: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
        }

        .account-card h2,
        .studio-card h2 {
            margin-top: 0;
        }

        .email {
            font-size: 18px;
            word-break: break-word;
        }

        .button-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button,
        .logout-link {
            border: none;
            border-radius: 10px;
            padding: 13px 22px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        button:hover,
        .logout-link:hover {
            transform: translateY(-2px);
        }

        .primary-button {
            background: #3367e8;
            color: white;
        }

        .secondary-button {
            background: rgba(255, 255, 255, 0.09);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .hidden {
            display: none !important;
        }
    </style>

</head>

<body>

<div id="loading" class="loading">
    Loading EOS...
</div>


<div id="dashboard" class="dashboard-page hidden">


    <div class="dashboard-header">

        <div>

            <h1>Welcome to EOS</h1>

            <p>Your EOS account dashboard</p>

        </div>


        <!-- LOGOUT -->

        <a
            href="index.html?logout=1"
            class="logout-link secondary-button"
        >
            Logout
        </a>

    </div>


    <div class="account-card">

        <h2>Account</h2>

        <p>
            Logged in as:
        </p>

        <p
            id="userEmail"
            class="email"
        >
            Loading...
        </p>

    </div>


    <div class="studio-card">

        <h2>EOS Studio</h2>

        <p>
            Enter the main EOS platform.
        </p>


        <div class="button-row">

            <button
                id="openStudio"
                class="primary-button"
                type="button"
            >
                Open EOS Studio
            </button>


            <button
                id="openBlackMamba"
                class="secondary-button"
                type="button"
            >
                Open Black Mamba
            </button>

        </div>

    </div>


</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyBXeNMJe6wMEb2u5KfDwOURenwF8f7Nlvg",

        authDomain:
            "eos-platform-of-gods.firebaseapp.com",

        projectId:
            "eos-platform-of-gods",

        storageBucket:
            "eos-platform-of-gods.firebasestorage.app",

        messagingSenderId:
            "313477636204",

        appId:
            "1:313477636204:web:4c869dd4e207dc01a03849"

    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    onAuthStateChanged(
        auth,
        (user) => {

            if (!user) {

                window.location.replace(
                    "index.html"
                );

                return;

            }


            document
                .getElementById("userEmail")
                .textContent =
                user.email || "EOS User";


            document
                .getElementById("loading")
                .classList
                .add("hidden");


            document
                .getElementById("dashboard")
                .classList
                .remove("hidden");

        }
    );


    document
        .getElementById("openStudio")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "../";

            }
        );


    document
        .getElementById("openBlackMamba")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "../bm/";

            }
        );

</script>

</body>

</html>
