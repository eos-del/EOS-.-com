<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EOS Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .dashboard-page {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 50px 0 80px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .dashboard-header h1 {
            margin: 0;
        }

        .dashboard-header p {
            margin-top: 8px;
        }

        .account-card,
        .studio-card {
            padding: 28px;
            margin-bottom: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
        }

        .account-card h2,
        .studio-card h2 {
            margin-top: 0;
        }

        .email {
            font-size: 18px;
            word-break: break-word;
        }

        .button-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px 22px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .primary-button {
            background: #3367e8;
            color: white;
        }

        .secondary-button {
            background: rgba(255, 255, 255, 0.09);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .message {
            min-height: 24px;
            margin-top: 18px;
        }

        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .hidden {
            display: none !important;
        }

    </style>

</head>


<body>


<div
    id="loading"
    class="loading"
>
    Loading EOS...
</div>


<div
    id="dashboard"
    class="dashboard-page hidden"
>


    <!-- HEADER -->

    <div class="dashboard-header">

        <div>

            <h1>Welcome to EOS</h1>

            <p>Your EOS account dashboard</p>

        </div>


        <button
            id="logoutButton"
            class="secondary-button"
        >
            Logout
        </button>

    </div>


    <!-- ACCOUNT -->

    <div class="account-card">

        <h2>Account</h2>

        <p>
            Logged in as:
        </p>

        <p
            id="userEmail"
            class="email"
        >
            Loading...
        </p>


        <div
            id="message"
            class="message"
        ></div>

    </div>


    <!-- EOS STUDIO -->

    <div class="studio-card">

        <h2>EOS Studio</h2>

        <p>
            Enter the main EOS platform.
        </p>


        <div class="button-row">

            <button
                id="openStudio"
                class="primary-button"
            >
                Open EOS Studio
            </button>


            <button
                id="openBlackMamba"
                class="secondary-button"
            >
                Open Black Mamba
            </button>

        </div>

    </div>


</div>



<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* -----------------------------------------
       FIREBASE CONFIG
    ----------------------------------------- */

    const firebaseConfig = {

        apiKey:
            "AIzaSyBXeNMJe6wMEb2u5KfDwOURenwF8f7Nlvg",

        authDomain:
            "eos-platform-of-gods.firebaseapp.com",

        projectId:
            "eos-platform-of-gods",

        storageBucket:
            "eos-platform-of-gods.firebasestorage.app",

        messagingSenderId:
            "313477636204",

        appId:
            "1:313477636204:web:4c869dd4e207dc01a03849"

    };


    /* -----------------------------------------
       INITIALIZE FIREBASE
    ----------------------------------------- */

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    /* -----------------------------------------
       ELEMENTS
    ----------------------------------------- */

    const loading =
        document.getElementById("loading");

    const dashboard =
        document.getElementById("dashboard");

    const userEmail =
        document.getElementById("userEmail");

    const message =
        document.getElementById("message");

    const logoutButton =
        document.getElementById("logoutButton");

    const openStudio =
        document.getElementById("openStudio");

    const openBlackMamba =
        document.getElementById("openBlackMamba");


    /* -----------------------------------------
       AUTH STATE
    ----------------------------------------- */

    onAuthStateChanged(
        auth,
        (user) => {

            if (!user) {

                window.location.href =
                    "index.html";

                return;

            }


            userEmail.textContent =
                user.email || "EOS User";


            loading.classList.add(
                "hidden"
            );

            dashboard.classList.remove(
                "hidden"
            );

        }
    );


    /* -----------------------------------------
       LOGOUT
    ----------------------------------------- */

    logoutButton.addEventListener(
        "click",
        async () => {

            try {

                await signOut(auth);

                window.location.href =
                    "index.html";

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Logout failed.";

            }

        }
    );


    /* -----------------------------------------
       OPEN EOS STUDIO
    ----------------------------------------- */

    openStudio.addEventListener(
        "click",
        () => {

            window.location.href =
                "../";

        }
    );


    /* -----------------------------------------
       OPEN BLACK MAMBA
    ----------------------------------------- */

    openBlackMamba.addEventListener(
        "click",
        () => {

            window.location.href =
                "../bm/";

        }
    );

</script>


</body>

</html>
