<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EOS Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .dashboard-page {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 50px 0 80px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .dashboard-header h1 {
            margin: 0;
        }

        .dashboard-header p {
            margin-top: 8px;
        }

        .account-card,
        .studio-card,
        .owner-card,
        .premium-card {
            padding: 28px;
            margin-bottom: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
        }

        .account-card h2,
        .studio-card h2,
        .owner-card h2,
        .premium-card h2 {
            margin-top: 0;
        }

        .email {
            font-size: 18px;
            word-break: break-word;
        }

        .button-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px 22px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .primary-button {
            background: #3367e8;
            color: white;
        }

        .secondary-button {
            background: rgba(255, 255, 255, 0.09);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .owner-card {
            display: none;
            border-color: rgba(255, 215, 0, 0.3);
            background:
                linear-gradient(
                    135deg,
                    rgba(255, 215, 0, 0.08),
                    rgba(139, 92, 246, 0.08)
                );
        }

        .premium-card {
            display: none;
            border-color: rgba(0, 229, 255, 0.3);
        }

        .owner-badge,
        .premium-badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: bold;
        }

        .owner-badge {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .premium-badge {
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        .owner-input {
            width: min(100%, 450px);
            padding: 14px;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.25);
            color: white;
            outline: none;
            font-size: 15px;
        }

        .message {
            min-height: 24px;
            margin-top: 16px;
        }

        .success {
            color: #00ff88;
        }

        .error {
            color: #ff5555;
        }

        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .hidden {
            display: none !important;
        }

    </style>

</head>


<body>


<div
    id="loading"
    class="loading"
>
    Loading EOS...
</div>


<div
    id="dashboard"
    class="dashboard-page hidden"
>


    <!-- HEADER -->

    <div class="dashboard-header">

        <div>

            <h1>Welcome to EOS</h1>

            <p>Your EOS account dashboard</p>

        </div>


        <button
            id="logoutButton"
            class="secondary-button"
            type="button"
        >
            Logout
        </button>

    </div>


    <!-- ACCOUNT -->

    <div class="account-card">

        <h2>Account</h2>

        <p>
            Logged in as:
        </p>

        <p
            id="userEmail"
            class="email"
        >
            Loading...
        </p>

    </div>


    <!-- EOS STUDIO -->

    <div class="studio-card">

        <h2>EOS Studio</h2>

        <p>
            Enter the main EOS platform.
        </p>

        <div class="button-row">

            <button
                id="openStudio"
                class="primary-button"
                type="button"
            >
                Open EOS Studio
            </button>


            <button
                id="openBlackMamba"
                class="secondary-button"
                type="button"
            >
                Open Black Mamba
            </button>

        </div>

    </div>


    <!-- OWNER -->

    <div
        id="ownerCard"
        class="owner-card"
    >

        <h2>👑 EOS Owner</h2>

        <span class="owner-badge">
            OWNER ACCOUNT RECOGNIZED
        </span>

        <p>
            Enter your separate EOS Owner Password.
        </p>


        <input
            id="ownerPassword"
            class="owner-input"
            type="password"
            placeholder="EOS Owner Password"
            autocomplete="off"
        >


        <div class="button-row">

            <button
                id="verifyOwnerButton"
                class="primary-button"
                type="button"
            >
                Verify Owner
            </button>

        </div>


        <p
            id="ownerMessage"
            class="message"
        ></p>

    </div>


    <!-- PREMIUM -->

    <div
        id="premiumCard"
        class="premium-card"
    >

        <h2>👑 Premium EOS Studio</h2>

        <span class="premium-badge">
            OWNER ACCESS VERIFIED
        </span>

        <p>
            Premium EOS features are unlocked.
        </p>


        <button
            id="openPremiumStudio"
            class="primary-button"
            type="button"
        >
            Open Premium EOS Studio
        </button>

    </div>


</div>



<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyBXeNMJe6wMEb2u5KfDwOURenwF8f7Nlvg",

        authDomain:
            "eos-platform-of-gods.firebaseapp.com",

        projectId:
            "eos-platform-of-gods",

        storageBucket:
            "eos-platform-of-gods.firebasestorage.app",

        messagingSenderId:
            "313477636204",

        appId:
            "1:313477636204:web:4c869dd4e207dc01a03849"

    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    const loading =
        document.getElementById("loading");

    const dashboard =
        document.getElementById("dashboard");

    const userEmail =
        document.getElementById("userEmail");

    const logoutButton =
        document.getElementById("logoutButton");

    const ownerCard =
        document.getElementById("ownerCard");

    const ownerPassword =
        document.getElementById("ownerPassword");

    const verifyOwnerButton =
        document.getElementById("verifyOwnerButton");

    const ownerMessage =
        document.getElementById("ownerMessage");

    const premiumCard =
        document.getElementById("premiumCard");


    let currentUser = null;


    /* -----------------------------------------
       AUTH STATE
    ----------------------------------------- */

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                window.location.replace(
                    "index.html"
                );

                return;

            }


            currentUser = user;


            userEmail.textContent =
                user.email || "EOS User";


            loading.classList.add(
                "hidden"
            );

            dashboard.classList.remove(
                "hidden"
            );


            /* -----------------------------------------
               OWNER RECOGNITION
            ----------------------------------------- */

            try {

                const idToken =
                    await user.getIdToken(true);


                const response =
                    await fetch(
                        "https://eos-owner-auth.swathiturl.workers.dev/",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${idToken}`,

                                "X-EOS-Action":
                                    "check-owner"
                            },

                            body:
                                JSON.stringify({})
                        }
                    );


                const result =
                    await response.json();


                if (
                    result.success === true &&
                    result.owner === true &&
                    result.verified === true
                ) {

                    ownerCard.style.display =
                        "block";

                }

            }

            catch (error) {

                console.error(
                    "Owner recognition failed:",
                    error
                );

            }

        }
    );


    /* -----------------------------------------
       LOGOUT
    ----------------------------------------- */

    logoutButton.addEventListener(
        "click",
        async () => {

            logoutButton.disabled = true;

            logoutButton.textContent =
                "Logging out...";


            try {

                await signOut(auth);

                /*
                   replace() prevents the browser
                   from simply returning to the
                   authenticated dashboard with
                   the Back button.
                */

                window.location.replace(
                    "index.html"
                );

            }

            catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

                logoutButton.disabled =
                    false;

                logoutButton.textContent =
                    "Logout";

                alert(
                    "Logout failed. Please try again."
                );

            }

        }
    );


    /* -----------------------------------------
       NORMAL EOS STUDIO
    ----------------------------------------- */

    document
        .getElementById("openStudio")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "../";

            }
        );


    /* -----------------------------------------
       BLACK MAMBA
    ----------------------------------------- */

    document
        .getElementById("openBlackMamba")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "../bm/";

            }
        );


    /* -----------------------------------------
       OWNER PASSWORD
    ----------------------------------------- */

    verifyOwnerButton.addEventListener(
        "click",
        async () => {

            const password =
                ownerPassword.value;


            if (!password) {

                ownerMessage.textContent =
                    "Enter your EOS Owner Password.";

                ownerMessage.className =
                    "message error";

                return;

            }


            if (!currentUser) {

                ownerMessage.textContent =
                    "You are not logged in.";

                ownerMessage.className =
                    "message error";

                return;

            }


            verifyOwnerButton.disabled =
                true;

            verifyOwnerButton.textContent =
                "Verifying...";


            try {

                const idToken =
                    await currentUser.getIdToken(true);


                const response =
                    await fetch(
                        "https://eos-owner-auth.swathiturl.workers.dev/",
                        {
                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${idToken}`

                            },

                            body:
                                JSON.stringify({
                                    password
                                })

                        }
                    );


                const result =
                    await response.json();


                if (
                    result.success === true &&
                    result.owner === true &&
                    result.premium === true
                ) {

                    ownerMessage.textContent =
                        "👑 Owner verification successful.";

                    ownerMessage.className =
                        "message success";


                    premiumCard.style.display =
                        "block";


                    ownerPassword.value = "";

                }

                else {

                    ownerMessage.textContent =
                        result.message ||
                        "Owner verification failed.";

                    ownerMessage.className =
                        "message error";

                }

            }

            catch (error) {

                console.error(error);

                ownerMessage.textContent =
                    "Unable to contact EOS Owner security.";

                ownerMessage.className =
                    "message error";

            }

            finally {

                verifyOwnerButton.disabled =
                    false;

                verifyOwnerButton.textContent =
                    "Verify Owner";

            }

        }
    );


    /* -----------------------------------------
       PREMIUM
    ----------------------------------------- */

    document
        .getElementById("openPremiumStudio")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "../";

            }
        );

</script>


</body>

</html>
