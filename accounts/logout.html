<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EOS Logout</title>

</head>


<body>


<p
    id="message"
    style="
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 100px;
        font-size: 20px;
    "
>
    Logging out of EOS...
</p>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyBXeNMJe6wMEb2u5KfDwOURenwF8f7Nlvg",

        authDomain:
            "eos-platform-of-gods.firebaseapp.com",

        projectId:
            "eos-platform-of-gods",

        storageBucket:
            "eos-platform-of-gods.firebasestorage.app",

        messagingSenderId:
            "313477636204",

        appId:
            "1:313477636204:web:4c869dd4e207dc01a03849"
    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    const message =
        document.getElementById("message");


    try {

        await signOut(auth);

        message.textContent =
            "Logged out successfully.";

        setTimeout(() => {

            window.location.replace(
                "index.html"
            );

        }, 500);

    }

    catch (error) {

        console.error(error);

        message.textContent =
            "Logout failed.";

    }

</script>


</body>

</html>
